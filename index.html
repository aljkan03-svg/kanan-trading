<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanan Trading Terminal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f19; color: #f3f4f6; display: flex; flex-direction: column; min-height: 100vh; }
        
        /* Header & Search Bar */
        .header-bar {
            background: #151c2c;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #1f2937;
            gap: 15px;
            flex-wrap: wrap;
        }
        .logo-title { font-size: 1.2rem; font-weight: bold; color: #38bdf8; }
        .search-container { display: flex; gap: 8px; flex: 1; max-width: 450px; }
        input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid #374151;
            background: #0f172a;
            color: #fff;
            font-size: 0.95rem;
            text-transform: uppercase;
            outline: none;
        }
        input[type="text"]:focus { border-color: #38bdf8; }
        button {
            padding: 10px 18px;
            border-radius: 6px;
            border: none;
            background: #0284c7;
            color: white;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        button:hover { background: #0369a1; }

        /* Candlestick Chart Section */
        .chart-section {
            width: 100%;
            height: 500px;
            background: #0b0f19;
            border-bottom: 2px solid #1f2937;
        }

        /* Trade Calculator Section */
        .calc-section {
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
        }
        .calc-card {
            background: #151c2c;
            border: 1px solid #1f2937;
            border-radius: 10px;
            padding: 20px;
        }
        .calc-title {
            font-size: 1.1rem;
            color: #38bdf8;
            margin-bottom: 15px;
            border-bottom: 1px solid #374151;
            padding-bottom: 8px;
        }
        .input-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-size: 0.85rem; color: #9ca3af; }
        .input-group input {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #374151;
            background: #0f172a;
            color: #fff;
            font-size: 0.95rem;
        }

        /* Results Display */
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        .result-box {
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #3b82f6;
        }
        .result-box.tp1 { border-color: #22c55e; }
        .result-box.tp2 { border-color: #10b981; }
        .result-box.sl { border-color: #ef4444; }
        .result-label { font-size: 0.85rem; color: #9ca3af; }
        .result-value { font-size: 1.3rem; font-weight: bold; margin-top: 5px; color: #fff; }
        .result-sub { font-size: 0.75rem; color: #6b7280; margin-top: 2px; }
    </style>
</head>
<body>

    <!-- 1. Top Search Bar -->
    <div class="header-bar">
        <div class="logo-title">Kanan Trading</div>
        <div class="search-container">
            <input type="text" id="symbolInput" placeholder="Enter Symbol (e.g. SPUS, NVDA, AAPL...)">
            <button onclick="changeSymbol()">Search Chart</button>
        </div>
    </div>

    <!-- 2. Candlestick Chart -->
    <div class="chart-section" id="tv_chart_container"></div>

    <!-- 3. Trade Calculator -->
    <div class="calc-section">
        <div class="calc-card">
            <div class="calc-title">Trade Level & Risk Management Calculator</div>
            
            <div class="input-grid">
                <div class="input-group">
                    <label>Entry Price ($)</label>
                    <input type="number" id="entryPrice" step="any" placeholder="e.g. 150.50" oninput="calculateTargets()">
                </div>
                <div class="input-group">
                    <label>Target 1 (TP1 %)</label>
                    <input type="number" id="tp1Pct" value="3" step="any" oninput="calculateTargets()">
                </div>
                <div class="input-group">
                    <label>Target 2 (TP2 %)</label>
                    <input type="number" id="tp2Pct" value="6" step="any" oninput="calculateTargets()">
                </div>
                <div class="input-group">
                    <label>Stop Loss (SL %)</label>
                    <input type="number" id="slPct" value="2" step="any" oninput="calculateTargets()">
                </div>
            </div>

            <!-- Calculation Results -->
            <div class="results-grid">
                <div class="result-box tp1">
                    <div class="result-label">Take Profit 1 (TP1)</div>
                    <div class="result-value" id="tp1Price">$0.00</div>
                    <div class="result-sub" id="tp1Profit">+0.00% Profit</div>
                </div>
                <div class="result-box tp2">
                    <div class="result-label">Take Profit 2 (TP2)</div>
                    <div class="result-value" id="tp2Price">$0.00</div>
                    <div class="result-sub" id="tp2Profit">+0.00% Profit</div>
                </div>
                <div class="result-box sl">
                    <div class="result-label">Stop Loss (SL)</div>
                    <div class="result-value" id="slPrice">$0.00</div>
                    <div class="result-sub" id="slLoss">-0.00% Loss</div>
                </div>
            </div>
        </div>
    </div>

    <!-- TradingView Candlestick Library -->
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script type="text/javascript">
        // Load TradingView Chart
        function loadChart(symbol) {
            document.getElementById('tv_chart_container').innerHTML = '';
            new TradingView.widget({
                "autosize": true,
                "symbol": symbol,
                "interval": "D",
                "timezone": "Etc/UTC",
                "theme": "dark",
                "style": "1", // 1 represents Candlesticks
                "locale": "en",
                "toolbar_bg": "#f1f3f6",
                "enable_publishing": false,
                "allow_symbol_change": true,
                "container_id": "tv_chart_container"
            });
        }

        function changeSymbol() {
            const symbol = document.getElementById('symbolInput').value.trim().toUpperCase();
            if (symbol) {
                loadChart(symbol);
            }
        }

        // Target and Stop Loss Calculator
        function calculateTargets() {
            const entry = parseFloat(document.getElementById('entryPrice').value);
            const tp1Pct = parseFloat(document.getElementById('tp1Pct').value) || 0;
            const tp2Pct = parseFloat(document.getElementById('tp2Pct').value) || 0;
            const slPct = parseFloat(document.getElementById('slPct').value) || 0;

            if (!entry || entry <= 0) {
                document.getElementById('tp1Price').innerText = '$0.00';
                document.getElementById('tp2Price').innerText = '$0.00';
                document.getElementById('slPrice').innerText = '$0.00';
                return;
            }

            const tp1Val = entry * (1 + tp1Pct / 100);
            const tp2Val = entry * (1 + tp2Pct / 100);
            const slVal = entry * (1 - slPct / 100);

            document.getElementById('tp1Price').innerText = '$' + tp1Val.toFixed(2);
            document.getElementById('tp1Profit').innerText = '+' + tp1Pct + '% Profit';

            document.getElementById('tp2Price').innerText = '$' + tp2Val.toFixed(2);
            document.getElementById('tp2Profit').innerText = '+' + tp2Pct + '% Profit';

            document.getElementById('slPrice').innerText = '$' + slVal.toFixed(2);
            document.getElementById('slLoss').innerText = '-' + slPct + '% Loss';
        }

        // Default Load: SPUS
        window.onload = function() {
            loadChart("SPUS");
        };
    </script>
</body>
</html>
