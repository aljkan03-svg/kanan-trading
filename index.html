<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanan Trading | Private Terminal</title>
    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-bg: #151c2c;
            --border: #1f2937;
            --text-main: #f3f4f6;
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
            --accent-gold: #f59e0b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
        }

        /* Password Lock Screen Overlay */
        #lockScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #05070f;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .lock-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 350px;
            width: 90%;
        }

        .lock-box h2 {
            color: var(--accent-green);
            margin-top: 0;
        }

        .pass-input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border-radius: 6px;
            border: 1px solid var(--border);
            background-color: var(--bg-dark);
            color: white;
            text-align: center;
            font-size: 1.1rem;
            box-sizing: border-box;
            outline: none;
        }

        .btn-unlock {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background-color: var(--accent-green);
            color: black;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }

        .btn-unlock:hover {
            background-color: #34d399;
        }

        .error-msg {
            color: #ef4444;
            font-size: 0.85rem;
            margin-top: 10px;
            display: none;
        }

        /* Top Navigation Bar */
        .top-bar {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 20px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            flex-grow: 1;
            max-width: 500px;
        }

        .search-input {
            width: 100%;
            padding: 10px 15px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
        }

        .btn-search {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            background-color: var(--accent-blue);
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .quick-links {
            display: flex;
            gap: 8px;
        }

        .btn-quick {
            padding: 6px 12px;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: #1e293b;
            color: var(--text-main);
            font-size: 0.85rem;
            cursor: pointer;
        }

        .btn-gold {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        .grid-container {
            display: grid;
            grid-template-columns: 420px 1fr;
            gap: 15px;
            height: calc(100vh - 120px);
        }

        @media (max-width: 1024px) {
            .grid-container {
                grid-template-columns: 1fr;
                height: auto;
            }
        }

        .panel {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chart-box {
            height: 100%;
            min-height: 550px;
            width: 100%;
        }
    </style>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
</head>
<body>

<!-- Lock Screen Overlay -->
<div id="lockScreen">
    <div class="lock-box">
        <h2>🔒 Kanan Trading</h2>
        <p style="color: #9ca3af; font-size: 0.9rem;">Private Access Only. Enter password to access terminal:</p>
        <input type="password" id="passInput" class="pass-input" placeholder="Enter Password">
        <button class="btn-unlock" onclick="checkPassword()">Unlock Terminal</button>
        <div id="errorMsg" class="error-msg">Incorrect Password! Access Denied.</div>
    </div>
</div>

<!-- Main Protected Content -->
<div id="mainContent" style="display: none;">
    <div class="top-bar">
        <div>
            <div style="color: var(--accent-green); font-size: 1.4rem; font-weight: bold;">Kanan Trading Terminal</div>
        </div>

        <div class="search-box">
            <input type="text" id="assetSearchInput" class="search-input" placeholder="Search Stock, ETF or Gold (e.g. AAPL, SPUS, HLAL, GOLD)...">
            <button class="btn-search" onclick="executeSearch()">Search</button>
        </div>

        <div class="quick-links">
            <button class="btn-quick btn-gold" onclick="loadSymbol('OANDA:XAUUSD')">🪙 GOLD (XAU/USD)</button>
            <button class="btn-quick" onclick="loadSymbol('AMEX:SPUS')">SPUS ETF</button>
            <button class="btn-quick" onclick="loadSymbol('NASDAQ:HLAL')">HLAL ETF</button>
            <button class="btn-quick" onclick="loadSymbol('AMEX:SPSK')">SPSK Sukuk</button>
            <button class="btn-quick" onclick="loadSymbol('NASDAQ:AAPL')">Apple</button>
        </div>
    </div>

    <div class="grid-container">
        <div class="panel">
            <h3 style="margin: 0 0 10px 0; font-size: 1rem; color: var(--accent-green);">10,000+ US Stocks & ETFs Screener</h3>
            <div class="tradingview-widget-container" style="height: 100%; width: 100%;">
                <div class="tradingview-widget-container__widget"></div>
                <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-screener.js" async>
                {
                  "width": "100%",
                  "height": "100%",
                  "defaultColumn": "overview",
                  "defaultScreen": "general",
                  "market": "america",
                  "showToolbar": true,
                  "colorTheme": "dark",
                  "locale": "en"
                }
                </script>
            </div>
        </div>

        <div class="panel">
            <div id="tv_chart_main" class="chart-box"></div>
        </div>
    </div>
</div>

<script type="text/javascript">
    // Set your private password here:
    const PRIVATE_PASSWORD = "123456"; 

    function checkPassword() {
        const enteredPass = document.getElementById('passInput').value;
        const errorMsg = document.getElementById('errorMsg');

        if (enteredPass === PRIVATE_PASSWORD) {
            document.getElementById('lockScreen').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
            loadSymbol('OANDA:XAUUSD');
        } else {
            errorMsg.style.display = 'block';
        }
    }

    document.getElementById('passInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            checkPassword();
        }
    });

    let tvWidget;

    function loadSymbol(symbol) {
        document.getElementById('tv_chart_main').innerHTML = '';
        tvWidget = new TradingView.widget({
            "autosize": true,
            "symbol": symbol,
            "interval": "D",
            "timezone": "Etc/UTC",
            "theme": "dark",
            "style": "1",
            "locale": "en",
            "toolbar_bg": "#151c2c",
            "enable_publishing": false,
            "allow_symbol_change": true,
            "hide_side_toolbar": false,
            "container_id": "tv_chart_main"
        });
    }

    function executeSearch() {
        const query = document.getElementById('assetSearchInput').value.trim().toUpperCase();
        if (query) {
            if (query === 'GOLD' || query === 'XAUUSD' || query === 'XAU/USD') {
                loadSymbol('OANDA:XAUUSD');
            } else {
                loadSymbol(query);
            }
        }
    }

    document.getElementById('assetSearchInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            executeSearch();
        }
    });
</script>

</body>
</html>
