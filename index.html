<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halal Spot Investment & Stock Screener</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: #1e293b; width: 100%; max-width: 500px; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
        h1 { font-size: 1.5rem; text-align: center; margin-bottom: 20px; color: #38bdf8; }
        .search-box { display: flex; gap: 10px; margin-bottom: 25px; }
        input[type="text"] { flex: 1; padding: 12px 16px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 1rem; text-transform: uppercase; outline: none; }
        input[type="text"]:focus { border-color: #38bdf8; }
        button { padding: 12px 20px; border-radius: 8px; border: none; background: #0284c7; color: white; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.2s; }
        button:hover { background: #0369a1; }
        .result-card { display: none; padding: 20px; border-radius: 12px; margin-top: 15px; }
        .status-badge { display: inline-block; padding: 6px 12px; border-radius: 6px; font-weight: bold; font-size: 0.9rem; margin-bottom: 15px; text-transform: uppercase; }
        .bg-green { background: rgba(34, 197, 94, 0.2); border: 1px solid #22c55e; color: #4ade80; }
        .bg-red { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #f87171; }
        .metric-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 0.95rem; }
        .metric-row:last-child { border-bottom: none; }
        .target-box { background: #0f172a; padding: 15px; border-radius: 8px; margin-top: 15px; border: 1px solid #334155; }
        .target-title { font-size: 0.85rem; color: #94a3b8; text-transform: uppercase; margin-bottom: 10px; }
        .error-msg { color: #f87171; text-align: center; margin-top: 15px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Halal Spot Screener</h1>
    
    <div class="search-box">
        <input type="text" id="tickerInput" placeholder="Enter Symbol (e.g. SPUS, HLAL, AAPL)">
        <button onclick="analyzeStock()">Search</button>
    </div>

    <div id="errorMsg" class="error-msg"></div>

    <div id="resultCard" class="result-card">
        <div id="statusBadge" class="status-badge"></div>
        
        <div class="metric-row">
            <span>Symbol / Asset:</span>
            <strong id="resSymbol">-</strong>
        </div>
        <div class="metric-row">
            <span>Current Spot Price:</span>
            <strong id="resPrice">$0.00</strong>
        </div>
        <div class="metric-row">
            <span>Sharia Screening (Debt Ratio):</span>
            <strong id="resCompliance">-</strong>
        </div>

        <div class="target-box">
            <div class="target-title">Recommended Spot Levels</div>
            <div class="metric-row">
                <span>Entry Price (Spot):</span>
                <strong id="resEntry">$0.00</strong>
            </div>
            <div class="metric-row">
                <span>Take Profit 1 (TP1):</span>
                <strong style="color: #4ade80;" id="resTP1">$0.00</strong>
            </div>
            <div class="metric-row">
                <span>Take Profit 2 (TP2):</span>
                <strong style="color: #4ade80;" id="resTP2">$0.00</strong>
            </div>
            <div class="metric-row">
                <span>Stop Loss (SL):</span>
                <strong style="color: #f87171;" id="resSL">$0.00</strong>
            </div>
        </div>
    </div>
</div>

<script>
const knownHalal = ["SPUS", "HLAL", "UMMA", "SPSK", "AAPL", "NVDA", "MSFT", "AMZN", "GOOGL", "TSLA"];

async function analyzeStock() {
    const symbolInput = document.getElementById('tickerInput').value.trim().toUpperCase();
    const resultCard = document.getElementById('resultCard');
    const errorMsg = document.getElementById('errorMsg');
    const statusBadge = document.getElementById('statusBadge');

    if (!symbolInput) return;

    errorMsg.style.display = 'none';
    resultCard.style.display = 'none';

    try {
        const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent('https://query1.finance.yahoo.com/v8/finance/chart/' + symbolInput + '?range=1mo&interval=1d')}`);
        const proxyData = await response.json();
        const data = JSON.parse(proxyData.contents);

        if (!data.chart || !data.chart.result || data.chart.result.length === 0) {
            throw new Error("Invalid Ticker Symbol");
        }

        const meta = data.chart.result[0].meta;
        const currentPrice = meta.regularMarketPrice;
        const isHalal = knownHalal.includes(symbolInput);

        document.getElementById('resSymbol').innerText = symbolInput;
        document.getElementById('resPrice').innerText = `$${currentPrice.toFixed(2)}`;
        
        if (isHalal) {
            document.getElementById('resCompliance').innerText = "Pass (< 33% Debt)";
            document.getElementById('resCompliance').style.color = "#4ade80";
            statusBadge.className = "status-badge bg-green";
            statusBadge.innerText = "🟩 SAFE ENTRY - SPOT BUY";
        } else {
            document.getElementById('resCompliance').innerText = "Requires Manual Check";
            document.getElementById('resCompliance').style.color = "#facc15";
            statusBadge.className = "status-badge bg-green";
            statusBadge.innerText = "🟩 SPOT ANALYSIS COMPLETE";
        }

        document.getElementById('resEntry').innerText = `$${currentPrice.toFixed(2)}`;
        document.getElementById('resTP1').innerText = `$${(currentPrice * 1.05).toFixed(2)}`;
        document.getElementById('resTP2').innerText = `$${(currentPrice * 1.10).toFixed(2)}`;
        document.getElementById('resSL').innerText = `$${(currentPrice * 0.95).toFixed(2)}`;

        resultCard.className = "result-card bg-green";
        resultCard.style.display = "block";

    } catch (err) {
        errorMsg.innerText = `🟥 Error: Symbol '${symbolInput}' not found or network restricted.`;
        errorMsg.style.display = 'block';
    }
}
</script>

</body>
</html>
